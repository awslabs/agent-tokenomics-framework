[pytest]
# Markers. `live` tests hit a DEPLOYED stack (AWS creds + endpoints required) and
# are OPT-IN: the default run below excludes them so unit tests stay fast/offline.
markers =
    live: hits a deployed stack over the network (opt-in; run with `-m live`)

# Default run = unit tests only (exclude live). Override with `-m live` to run the
# live governance suite, or `-m "live or not live"` to run everything.
addopts = -m "not live"

testpaths =
    tests
